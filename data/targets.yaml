# Target specification and weighting for the multi-objective figure of merit.
#
# Values are taken from the project brief, sections 16 and 17 and the
# "quantitative screening framework" table. Edit this file rather than the
# code: the weighting is an engineering judgement about the application, not
# a physical constant, and architectural glazing, automotive and display
# electrodes all want different numbers here.
#
# direction:  higher | lower | target
# floor:      value at which desirability reaches 0 (unacceptable)
# target:     value at which desirability reaches 1 (fully satisfied)
# exponent:   curvature. 1 = linear. >1 penalises near-miss values harder,
#             <1 is more forgiving.

criteria:

  T_vis:
    label: Visible transmittance
    direction: higher
    floor: 0.65
    target: 0.90
    exponent: 1.0
    unit: ""
    source: "brief section 17: >= 80% initial target"

  emissivity_hemispherical:
    label: Hemispherical emissivity
    direction: lower
    floor: 0.20
    target: 0.02
    exponent: 1.0
    unit: ""
    source: "brief section 17: <= 0.15; quantitative framework: <= 0.10, preferably <= 0.05"

  R_sheet:
    label: Sheet resistance
    direction: lower
    floor: 15.0
    target: 5.0
    exponent: 1.0
    unit: ohm/sq
    source: "brief section 17: <= 5 ohm/sq"

  Ag_g_per_m2:
    label: Silver consumption
    direction: lower
    floor: 0.16
    target: 0.0
    exponent: 1.0
    unit: g/m2
    source: "brief section 20: minimise critical-material content. Floor is the
             areal mass of a 11 nm pure Ag layer, i.e. a conventional single-
             silver Low-E; scoring 0 there means 'no better than the incumbent'."

  cost_usd_per_m2:
    label: Metal cost
    direction: lower
    floor: 3.0
    target: 0.5
    exponent: 1.0
    unit: USD/m2
    source: "brief section 17: significantly below conventional benchmark"

  supply_risk:
    label: Supply risk
    direction: lower
    floor: 9.5
    target: 4.0
    exponent: 1.0
    unit: ""
    source: "brief section 9 stage 1; composition-weighted element supply risk"

  structural_stability:
    label: Structural stability
    direction: lower
    floor: 0.100
    target: 0.000
    exponent: 1.0
    unit: eV/atom
    source: "energy above the convex hull. Floor 0.100 eV/atom is roughly 2x
             kT at a 550 C anneal, above which a phase is unlikely to survive
             processing; target 0 is on the hull.

             NOW PARTLY POPULATABLE. When this criterion was written the value
             was unavailable and it was carried at weight 0.15 while always
             being None -- so it silently renormalised away, and a third of the
             nominal weight was doing nothing. The Materials Project screening
             of 2026-08 supplies hull distances for ordered phases (Ag-Cu has
             none stable: Cu3Ag 0.0904, CuAg3 0.0857 eV/atom) and the MLIP
             mixing energies extend that to the disordered solid solution
             (dE_mix = 0.287*x*(1-x)). See FINDINGS sections 3.7 and 3.8.

             It is deliberately still weighted 0.0 pending a decision: filling
             it would change every ranking, and the values carry a systematic
             under-prediction of 20-40% inherited from GGA. Populate and
             re-weight together, not separately."

  g_value:
    label: Solar heat gain (SHGC)
    direction: lower
    floor: 0.75
    target: 0.27
    exponent: 1.0
    unit: ""
    source: "EN 410 / ISO 9050, SINGLE PANE with the standard N = 0.36 inward
             fraction -- NOT the assembly value a building code specifies.
             Target 0.27 is the ECBC 2017 prescriptive limit for vertical
             fenestration in India's composite climate; floor 0.75 is roughly
             uncoated double glazing.
             BASIS WARNING: ECBC's 0.27 is an ASSEMBLY figure, frame and glass
             area-weighted. This criterion is centre-of-glass and single-pane.
             Chaining a clear second pane (T_sol 0.83) gives an approximate DGU
             SHGC of 0.83x this value, and a frame lowers it further. Indicative,
             not a compliance check -- see FINDINGS 3.11.
             Weighted 0.0 in the heating profile, where solar gain is a benefit.
             It carries real weight in targets_cooling.yaml."

  U_g:
    label: Centre-pane U-value
    direction: lower
    floor: 2.0
    target: 1.0
    exponent: 1.0
    unit: W/m2K
    source: "EN 673 centre-pane of an argon-filled double-glazed unit, 16 mm gap.
             Uncoated double glazing is about 2.7; target 1.0 is the practical
             floor for a single silver layer.
             NOT BINDING for any candidate in this set: every one lands between
             1.12 and 1.29 W/m2K, and ECBC's assembly limit of 3.0 leaves room
             even after a frame adds 0.5-1.5. Defined and weighted 0.0 so the
             headroom is visible rather than assumed."

  thermal_stability_c:
    label: Thermal stability
    direction: higher
    floor: 200.0
    target: 500.0
    exponent: 1.0
    unit: degC
    source: "brief section 17: 300-500 C test window. NOT PREDICTED by this
             framework -- supply a measured value or leave it out of the score."

  deposition_efficiency:
    label: Deposition efficiency
    direction: higher
    floor: 0.2
    target: 1.0
    exponent: 1.0
    unit: ""
    source: "brief section 15: performance per unit deposition energy, not
             raw deposition rate"

# Weighting from the brief's section 14. Weights are renormalised over
# whichever criteria are actually available for a given candidate, so a
# candidate missing a measured thermal-stability number is scored on the rest
# rather than silently penalised.
# CORRECTED from the brief's section 14. Two deliberate departures, both
# documented in docs/FINDINGS.md:
#
# 1. Ag_g_per_m2 gets 0.15. The brief's section 14 table has no silver-
#    consumption line, even though sections 17 and 20 both name minimising Ag
#    as an objective. Encoding section 14 literally left the project's central
#    goal at zero weight, and the thickness optimiser duly returned a design
#    using MORE silver than the benchmark while scoring 100/100.
#
# 2. R_sheet drops from 0.15 to 0.0. It correlates with
#    emissivity_hemispherical at r = 0.996 across the candidate set -- both are
#    the free-carrier response of the same layer -- so scoring both put 0.40 of
#    the weight on one physical property. Sheet resistance is still computed
#    and reported; it is a constraint to check, not an independent objective.
#    Restore it (and cut emissivity to 0.15) if the coating must also serve as
#    a transparent electrode, where R_s matters in its own right.
weights:
  T_vis: 0.20
  emissivity_hemispherical: 0.25
  Ag_g_per_m2: 0.15

  # Reported, not scored -- each correlates with a weighted criterion above.
  # R_sheet with emissivity at r = 0.978; cost with silver mass at r = 1.000
  # (silver dominates metal cost so completely that cost is the same quantity
  # in different units); supply risk with silver mass at r = 0.991. Weighting
  # all of them put 36% of the effective weight on one physical property.
  R_sheet: 0.0
  cost_usd_per_m2: 0.0
  supply_risk: 0.0

  # Defined so their headroom is visible, weighted 0.0 here because this is the
  # HEATING profile, where solar gain is a benefit rather than a penalty.
  # g_value carries real weight in targets_cooling.yaml, which is the point of
  # having two files. U_g is not binding for any candidate in the set.
  g_value: 0.0
  U_g: 0.0

  # Not predicted by this framework for any candidate. Carrying weight on an
  # always-missing criterion does nothing except renormalise silently: 0.30 of
  # a 0.90 nominal total was being redistributed onto the three criteria that
  # do have values, inflating their influence without saying so.
  #
  # structural_stability is now partly populatable from the Materials Project
  # screening and the surrogate mixing energies; see its definition above.
  # Restore its weight and populate it in the same change, never separately.
  structural_stability: 0.0
  thermal_stability_c: 0.0
  deposition_efficiency: 0.0

aggregation: geometric
