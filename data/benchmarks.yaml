  - id: agcu_thin_film_resistivity
    label: "~10 nm Ag, Ag-Cu and Cu films"
    brief_section: 7
    citation: >
      Ag-Cu amorphous alloy thin-films with unusually high electrical
      conductivity. PII S2589152925001930 (2025). Related patents US 10,822,692
      and US 11,840,756, University of North Texas.
    verified: partial
    verified_note: >
      Numbers confirmed correctly transcribed. IMPORTANT: the framework's
      original consistency flag proposed that 1.59 uohm.cm was a bulk reference
      tabulated alongside measurements. THAT HYPOTHESIS IS WRONG. The abstract
      states the pure Ag and Cu films were "deposited under identical
      conditions for comparison" at the same ~10 nm thickness, so 1.59 is
      claimed as a measurement. The physical objection therefore stands and
      strengthens: films are 10 +/- 2.5 nm on thermal oxide, and even the
      thickest end of that range gives 1.25x bulk against an FS-MS floor near
      3x. Their own Cu at 12.2x bulk is consistent with size effects; their Ag
      at 1.00x is not, under identical deposition.
    architecture: null
    reported:
      resistivity_ag_uohm_cm: 1.59
      resistivity_agcu_uohm_cm: 2.97
      resistivity_cu_uohm_cm: 20.5
      thickness_nm: 10.0
    note: >
      Used in the brief to argue that amorphous Ag-Cu retains unusually good
      conductivity. Check the thickness attribution carefully: 1.59 uohm.cm is
      the bulk resistivity of silver to three figures.
