  - id: azo_cu_azo_optimised
    label: "AZO(40)/Cu/AZO(40), DC magnetron, optimised"
    brief_section: 16
    citation: >
      Preparation of AZO/Cu/AZO films with low infrared emissivity, high
      conductivity and high transmittance by adjusting the AZO layer.
      Applied Surface Science 578 (2022) 152051. PII S0169433221030865.
      ADS 2022ApSS..57852051S. Xi'an University of Architecture and Technology.
    verified: partial
    verified_note: >
      Numbers confirmed correctly transcribed from the published abstract, and
      confirmed to come from THE SAME SAMPLE (the 40 nm AZO variant) -- which
      rules out the "different samples" explanation for the impedance
      discrepancy. Full text not read: the measurement basis (normal vs
      hemispherical, and the instrument band) is still unknown, and that is now
      the only remaining explanation. Requires institutional access.
    architecture:
      metal: {Cu: 1.0}
      metal_thickness_nm: 12.0
      tco: AZO
      tco_thickness_nm: 40.0
    reported:
      T_vis: 0.877
      R_sheet: 9.96
      emissivity: 0.055
    note: >
      This is the brief's pivotal result -- section 16 concludes from it that
      an Ag-free stack may already meet the emissivity target. It is therefore
      the single most important entry to verify against the primary source
      before building a research programme on it.

