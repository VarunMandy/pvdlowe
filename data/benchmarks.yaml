  - id: azo_cu_azo_15nm
    label: "AZO/Cu(15)/AZO"
    brief_section: 8
    citation: >
      Miao, Jiang, Shang & Chen, "Transparent conductive and infrared reflective
      AZO/Cu/AZO multilayer film prepared by RF magnetron sputtering",
      J. Mater. Sci.: Mater. Electron. 25 (2014) 5248-5254,
      DOI 10.1007/s10854-014-2297-0. Institute of Textiles and Clothing,
      The Hong Kong Polytechnic University.
    verified: partial
    architecture:
      metal: {Cu: 1.0}
      metal_thickness_nm: 15.0
      tco: AZO
      tco_thickness_nm: 30.0
    reported:
      R_sheet: 16.6
      far_ir_reflectance: 0.67
      continuity_thickness_nm: 11.0
    verified_note: >
      FULLY CONFIRMED AGAINST THE ABSTRACT, but the full text has not been
      read, so this stays `partial` by the rule that a `true` flag records what
      was read rather than how convincing it is. Every element confirmed:
      "Cu inner layer started forming a continuous film at the thickness around
      11 nm ... sample with 15 nm Cu inner layer showed the highest infrared
      reflection rate of 67 % in FIR region and the lowest sheet resistance of
      16.6 Ohm/sq." On GLASS substrate, by RF magnetron sputtering, measured by
      four-point probe and FTIR -- the same basis this framework uses.

      NOT THE SAME STUDY AS azo_cu_azo_optimised, and the two must not be
      pooled. Different group, different technique (RF against DC), different
      decade, and this one is from a textiles laboratory that also coats
      polyester fabric with the same stacks -- not a glazing group.

      PASSES THE IMPEDANCE CHECK, which is the significant part. 67% far-IR
      reflectance implies emissivity 0.330; the thin-sheet floor at 16.6 Ohm/sq
      is 0.150. Consistent with a margin of +0.18.

      THIS IS ALSO THE SOURCE OF THE FRAMEWORK'S LARGEST ERROR. The model
      predicts 2.16 Ohm/sq for a 15 nm Cu layer against the 16.6 measured here
      -- a factor of 7.7. So the two copper entries sit in exactly opposite
      positions: this one obeys the electrodynamic limit and disagrees with the
      model, while azo_cu_azo_optimised agrees with the model's optimism and
      violates the limit. That contrast is stronger evidence than either entry
      alone. See docs/LITERATURE_CALIBRATION.md.
  - id: azo_cu_azo_optimised
    label: "AZO(40)/Cu/AZO(40), DC magnetron, optimised"
    brief_section: 16
    citation: >
      Preparation of AZO/Cu/AZO films with low infrared emissivity, high
      conductivity and high transmittance by adjusting the AZO layer.
      Applied Surface Science 578 (2022) 152051. PII S0169433221030865.
      ADS 2022ApSS..57852051S. Xi'an University of Architecture and Technology.
    verified: partial
    architecture:
      metal: {Cu: 1.0}
      metal_thickness_nm: 12.0
      tco: AZO
      tco_thickness_nm: 40.0
    reported:
      T_vis: 0.877
      R_sheet: 9.96
      emissivity: 0.055
    verified_note: >
      Numbers confirmed against the published abstract of Applied Surface
      Science 578 (2022) 152051: "The multilayer film with 40 nm-thickness AZO
      layer shows the lowest sheet resistance of 9.96 Ohm/sq, lowest infrared
      emissivity of 0.055 and high transmittance of 87.7 %." Glass substrate,
      DIRECT-CURRENT magnetron sputtering at room temperature. All three
      figures are attributed to one sample.

      THE MEASUREMENT-BASIS QUESTION IS NOW CLOSED, and it was the last benign
      explanation standing. The impedance floor is a normal-incidence quantity,
      so the question was whether 0.055 might be hemispherical and therefore
      not comparable. Testing both readings:

        if 0.055 is NORMAL         -> floor 0.0956, fails by 42%
        if 0.055 is HEMISPHERICAL  -> normal equivalent 0.0472, fails by 51%

      Reading it as hemispherical makes the discrepancy WORSE, because the
      normal equivalent is lower still. Neither basis rescues the value.

      Every explanation has now been tested and eliminated: different samples,
      transcription, far-IR glass index, band-limited emissometer, this
      framework's own convention (an industrial formula in use since 2000 gives
      the same answer), and now measurement basis. eps 0.055 would require
      about 5.48 Ohm/sq, against the 9.96 reported.

      THE BRIEF'S SECTION 16 CONCLUSION RESTS ENTIRELY ON THIS ENTRY and
      should not be used. The full text remains paywalled; what it would add is
      the instrument model, not a resolution -- the arithmetic above does not
      depend on it.
  - id: azo_standalone
    label: "AZO single layer"
    brief_section: 2
    citation: >
      A Comprehensive Investigation of the Mechanical and Tribological Properties
      of AZO Transparent Conducting Oxide Thin Films Deposited by Medium
      Frequency Magnetron Sputtering. Materials 17(1), 81 (2024).
      DOI 10.3390/ma17010081.
    verified: true
    architecture:
      metal: null
      tco: AZO
      tco_thickness_nm: 380.0
    reported:
      T_vis: 0.824
      resistivity_ohm_cm: 2.6e-3
      R_sheet: 68.0
      band_gap_ev: 3.12
      hardness_gpa: 11.4
      youngs_modulus_gpa: 98.0
    verified_note: >
      FULLY VERIFIED. Full text read via the open-access version
      (CC BY, MDPI). Mazur, Kiliszkiewicz, Posadowski, Domaradzki,
      Malachowska, Sokolowski, Materials 17(1), 81 (2024),
      DOI 10.3390/ma17010081.

      CONFIRMED: resistivity 2.6e-3 ohm.cm; band gap 3.12 eV by Tauc for
      allowed indirect transitions; hardness 11.4 GPa; reduced modulus 98 GPa;
      sheet resistance 68 ohm/sq (rho/t with t = 380 nm gives 68.4).

      RETRACTION OF AN EARLIER CORRECTION. This entry previously recorded that
      the brief's 82.4% visible transmittance was a transcription error for
      81.4%. That was wrong, and the error was mine. The paper reports BOTH:
      section 3.1 states "the average transparency in the visible range (from
      360 to 760 nm) is 82.4%", while the abstract and conclusions state 81.4%.
      The source is internally inconsistent. The brief quoted the Results
      figure, which is defensible; the abstract-only check that produced the
      "correction" was not.

      NEWLY ESTABLISHED, and not in the brief: film thickness 380 +/- 5 nm,
      measured by optical profilometry. This independently confirms the
      framework's earlier inference from rho/R_s that the entry implied a film
      of about 380 nm -- far thicker than the 30-40 nm layers used inside the
      multilayer stacks, so its resistivity is not directly transferable.

      ALSO ESTABLISHED: crystallite sizes by Scherrer are 14.0 nm (ZnO 002),
      17.7 nm (Al2O3 023) and 16.2 nm (Al2ZnO4 220) in a 380 nm film -- about
      0.04x the thickness. The authors attribute the unusually high hardness to
      this nanocrystalline structure via Hall-Petch. Directly relevant to the
      grain-size hypothesis in docs/LITERATURE_CALIBRATION.md: strongly
      nanocrystalline growth is normal for magnetron-sputtered oxide films.

      Deposition: medium-frequency pulsed magnetron (100 kHz, 100 W, 35 min),
      98 wt% ZnO / 2 wt% Al2O3 target, off-axis geometry, 3.2 wt% Al in the
      film. Substrate fused silica for XRD, Corning glass for nanoindentation
      -- NOT soda-lime float glass.

  - id: agcu_thin_film_resistivity
    label: "~10 nm Ag, Ag-Cu and Cu films"
    brief_section: 7
    citation: >
      Ag-Cu amorphous alloy thin-films with unusually high electrical
      conductivity. PII S2589152925001930 (2025). Related patents US 10,822,692
      and US 11,840,756, University of North Texas.
    verified: true
    architecture: null
    reported:
      resistivity_ag_uohm_cm: 1.59
      resistivity_agcu_uohm_cm: 2.97
      resistivity_cu_uohm_cm: 20.5
      thickness_nm: 10.0
    source_actual:
      resistivity_ag_uohm_cm_patent: 1.29
      resistivity_ag_uohm_cm_journal: 1.59
      note: >
        The two sources by the same group DISAGREE with each other. The journal
        article reports 1.59; the patent reports 1.29. `reported` holds 1.59
        because that is what both the brief and the journal state, and it is
        what the consistency check must judge.
    verified_note: >
      VERIFIED, and a correction to an earlier entry in this file.

      Sources: Applied Materials Today (2025), PII S2589152925001930, and the
      associated patent US 10,822,692 B2 (Das & Mukherjee, University of North
      Texas). Film DC magnetron sputtered from an Ag-Cu eutectic target,
      60.12 at.% Ag / 39.88 at.% Cu.

      WHAT WAS ACTUALLY READ. The patent full text, in its entirety, via Google
      Patents. The journal article is paywalled and its figures here are second
      hand -- confirmed independently by a reader with access, not read by the
      author of this file. That asymmetry is the direct cause of the retraction
      below: having read only the patent, its figure was taken as authoritative
      and the difference attributed to the brief. Retaining `verified: true` is
      justified by the patent full text; the journal figures carry the weaker
      standing and are labelled as such above.

      RETRACTION. An earlier version of this note stated that the brief had
      mistranscribed the silver value, on the grounds that the patent says 1.29
      where the brief says 1.59. That was wrong, and wrong in a way this project
      has now recorded twice. The journal article reports 1.59. THE BRIEF IS
      FAITHFUL TO ITS SOURCE. What actually exists is an inconsistency between
      two publications by the same group describing the same films:

        journal 1.59 uohm.cm   =  1.00x bulk silver
        patent  1.29 uohm.cm   =  0.81x bulk -- impossible at room temperature

      The error was reading one source, finding a different number, and
      concluding the other party had transcribed badly. That is the same
      mistake made over the AZO transmittance in section 3.1 of REFERENCES.md,
      where a paper reporting 82.4% in Results and 81.4% in its abstract was
      likewise assumed to have been mistranscribed.

      THE ANOMALY STANDS, AND IS INDEPENDENT OF WHICH SOURCE IS TAKEN. Silver's
      electron mean free path is 53 nm, so a 10 nm film sits deep in the
      size-effect regime. Fuchs-Sondheimer with diffuse surface scattering,
      rho/rho_0 ~ 1 + (3/8)(lambda/d), gives 2.99x bulk = 4.74 uohm.cm before
      any grain-boundary term. This framework's full FS + Mayadas-Shatzkes
      model gives 4.44. An independent measurement of a 12 nm Ag film on
      sapphire gives 4.8, which this framework reproduces to 17%.

      A 10 nm polycrystalline silver film landing exactly at bulk resistivity
      would be a headline result in its own right, and the paper does not treat
      it as one -- it is a control. Sloppy control characterisation is the more
      likely explanation than a physical effect.

      The patent also prints the alloy value as "2.97e6 Ohm-cm", twelve orders
      of magnitude out. Numeric care across this group's record is not high.

      WHAT IS DEFENSIBLE TO CITE. The comparative claim: amorphous Ag-Cu at
      2.97 uohm.cm beats polycrystalline Cu of the same thickness at 20.5 by
      about sevenfold, and the absence of grain boundaries in an amorphous
      structure is the paper's actual contribution. Do NOT cite 1.59 as a
      validated pure-Ag thin-film benchmark.

      AND A LIMIT ON ITS RELEVANCE HERE. This is an interconnect paper, not an
      optics one. A conductivity figure says nothing about infrared reflectance,
      and amorphous metals do not share crystalline silver's optical constants.
      The low-loss Drude response that makes silver the Low-E workhorse depends
      on it being crystalline, so a conductivity gain from amorphisation does
      not transfer to emissivity or to light-to-solar-gain. See FINDINGS 3.13.

  - id: agc_underlayer_sheet_resistance
    label: "16 nm Ag on ZnO/a-TiOx vs a-TiOx alone"
    brief_section: null
    citation: >
      Glenn, Johnson, Dannenberg, Sieck & Countrywood, Double silver
      low-emissivity and solar control coatings, US 7,632,572 B2 /
      US 8,512,883 B2, AFG Industries / AGC Flat Glass North America
      (now Cardinal CG), priority 2001-09-04, Example 1.
    verified: true
    architecture: null
    reported:
      R_sheet_on_ZnO_seed: 5.68
      R_sheet_on_aTiOx: 7.56
      ratio: 1.331
      ag_thickness_nm: 16.0
      grain_size_on_ZnO_nm: 25.0
      grain_size_on_aTiOx_nm: 15.0
      min_continuous_Ag_on_ZnO_nm: 8.0
    verified_note: >
      FULLY VERIFIED. Full text read via Google Patents; every figure confirmed
      in the Description, Example 1.

      This is the independent validation of TCOPreset.metal_growth_factor. The
      framework's factors were calibrated from Cueva & Carretero's EMISSIVITY
      series and give a TiO2:AZO ratio of 1.250. This patent measured
      four-point sheet resistance directly and gives 1.331 -- agreement to 6%,
      from a different group, decade and measured quantity.

      The inventors state the mechanism explicitly: ZnO grows {0001}, which
      orients Ag to grow {111}, and the epitaxial lattice match between
      Ag{111} and ZnO{0001} lowers sheet resistance and improves adhesion.
      That is the templating hypothesis, named by the people who measured it.

      CAVEAT ON THE COMPARISON: the patent contrasts ZnO(5 nm)/a-TiOx against
      a-TiOx alone -- both stacks contain amorphous titania and the ZnO is a
      thin seed, so 1.331 is the effect of ADDING a seed layer rather than of
      ZnO versus TiO2 as bulk dielectrics. The close agreement is encouraging
      but partly fortuitous.

      ALSO ESTABLISHED: the patent claims continuous, strongly adherent Ag down
      to 8 nm on a ZnO seed, against the framework's assumed 10 nm critical
      thickness. A 20% difference that affects every silver-consumption figure.
