# Literature benchmarks transcribed from the project brief.
#
# EVERY entry here is provenance LITERATURE_UNVERIFIED. They were quoted in
# the brief, and the brief's citation URLs all carry a `utm_source=chatgpt.com`
# query parameter, meaning they were surfaced by an LLM rather than read from
# the publisher. That does not make them wrong. It does mean none of them has
# been checked against the primary source, and none should enter a thesis,
# a proposal or a results table until it has.
#
# `pvdlowe validate` compares each of these against the framework's own model
# and reports the disagreements. Disagreement is not proof that the literature
# is wrong -- the model is approximate too -- but a benchmark the model cannot
# come near, or one that is internally inconsistent, is a benchmark to check
# first.
#
# verified: false -> primary source not yet opened
# Set to true and record the DOI once you have the paper in front of you.

