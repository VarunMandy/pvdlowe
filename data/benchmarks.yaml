# Literature benchmarks transcribed from the project brief.
#
# EVERY entry here is provenance LITERATURE_UNVERIFIED. They were quoted in
# the brief, and the brief's citation URLs all carry a `utm_source=chatgpt.com`
# query parameter, meaning they were surfaced by an LLM rather than read from
# the publisher. That does not make them wrong. It does mean none of them has
# been checked against the primary source, and none should enter a thesis,
# a proposal or a results table until it has.
#
# `pvdlowe validate` compares each of these against the framework's own model
# and reports the disagreements. Disagreement is not proof that the literature
# is wrong -- the model is approximate too -- but a benchmark the model cannot
# come near, or one that is internally inconsistent, is a benchmark to check
# first.
#
# verified: false -> primary source not yet opened
# Set to true and record the DOI once you have the paper in front of you.

benchmarks:

  - id: azo_ag_azo_10nm
    label: "AZO(30)/Ag(10)/AZO(30) on glass"
    brief_section: 3
    source_hint: "PolyU Scholars Hub record, IR reflective properties of AZO/Ag/AZO trilayers"
    citation: >
      Infrared reflective properties of AZO/Ag/AZO trilayers prepared by RF
      magnetron sputtering. Ceramics International (2014), PII S0272884214006944.
    verified: partial
    architecture:
      metal: {Ag: 1.0}
      metal_thickness_nm: 10.0
      tco: AZO
      tco_thickness_nm: 30.0
    reported:
      T_vis: 0.805
    verified_note: >
      LOCATED, numbers confirmed from the abstract. Two corrections to the
      brief: (a) deposition was RF magnetron sputtering, not DC as the brief's
      section 3 implies; (b) far-IR reflectance was measured by FTIR
      spectroscopy and sheet resistance by four-point probe -- so this is a
      spectroscopic reflectance, directly comparable with the framework, NOT an
      emissometer band value. Ag continuity at 10 nm is confirmed independently
      by XRD (200 and 220 Ag peaks), which is the anchor the percolation model
      is calibrated to. Full text unread.

  - id: azo_ag_azo_13nm
    label: "AZO(30)/Ag(13)/AZO(30) on glass"
    brief_section: 3
    source_hint: "same trilayer study, thicker Ag"
    citation: >
      Same source: Ceramics International (2014), PII S0272884214006944.
    verified: partial
    architecture:
      metal: {Ag: 1.0}
      metal_thickness_nm: 13.0
      tco: AZO
      tco_thickness_nm: 30.0
    reported:
      R_sheet: 4.36
      far_ir_reflectance: 0.96
    verified_note: >
      LOCATED. 4.36 ohm/sq and 96% FIR reflection both attributed to the
      AZO(30)/Ag(13)/AZO(30) structure. FTIR + four-point probe, so the
      measurement basis matches the framework's own convention. This is the
      benchmark the model reproduces best (0.4% on FIR reflectance), which is
      consistent with it being a like-for-like comparison. Full text unread.

