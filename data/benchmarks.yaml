      magnetron sputtering, Vacuum (2014), PII S0042207X14000736.
    verified: disputed
    architecture:
      metal: {Ag: 1.0}
      metal_thickness_nm: 12.0
      tco: AZO
      tco_thickness_nm: 30.0
    reported:
      T_vis: 0.854
      R_sheet: 3.21
      far_ir_reflectance: 0.97
    verified_note: >
      PROBABLE MISATTRIBUTION IN THE BRIEF. The companion paper reports 78.5%
      visible transmittance with 91% FIR at 10 nm Ag, and 96% FIR at 15 nm --
      and it is on PET, not glass. The brief's 85.4% / 3.21 ohm/sq / 97% figures
