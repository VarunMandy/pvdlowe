# COOLING-DOMINATED CLIMATE PROFILE (Mumbai, Chennai, Dubai, Singapore).
#
# Use with:  pvdlowe evaluate --targets data/targets_cooling.yaml
#
# The difference from the default profile is one criterion and it changes the
# answer. In a heating-dominated climate, transmitted solar energy offsets
# heating demand and a high g-value is an asset; the default targets.yaml
# therefore does not constrain it. In a cooling-dominated climate every unit
# of admitted solar energy is a unit the air conditioning must remove, so the
# solar heat gain coefficient becomes a first-class objective.
#
# The metric added here is LSG = T_vis / g: daylight admitted per unit of
# solar heat. Above ~1.25 a glazing is conventionally called spectrally
# selective; commercial triple-silver solar-control products reach about 2.
#
# Weight for LSG is taken from T_vis (0.20 -> 0.10) rather than added on top,
# because in this climate the two are not independent goals -- what you want
# is daylight WITHOUT heat, which is exactly what LSG measures.
#
# Target specification and weighting for the multi-objective figure of merit.
#
# Values are taken from the project brief, sections 16 and 17 and the
# "quantitative screening framework" table. Edit this file rather than the
# code: the weighting is an engineering judgement about the application, not
# a physical constant, and architectural glazing, automotive and display
# electrodes all want different numbers here.
#
# direction:  higher | lower | target
# floor:      value at which desirability reaches 0 (unacceptable)
# target:     value at which desirability reaches 1 (fully satisfied)
# exponent:   curvature. 1 = linear. >1 penalises near-miss values harder,
#             <1 is more forgiving.

criteria:

  T_vis:
    label: Visible transmittance
    direction: higher
    floor: 0.65
    target: 0.90
    exponent: 1.0
    unit: ""
    source: "brief section 17: >= 80% initial target"

  emissivity_hemispherical:
    label: Hemispherical emissivity
    direction: lower
    floor: 0.20
    target: 0.02
    exponent: 1.0
    unit: ""
    source: "brief section 17: <= 0.15; quantitative framework: <= 0.10, preferably <= 0.05"

  R_sheet:
    label: Sheet resistance
    direction: lower
    floor: 15.0
    target: 5.0
    exponent: 1.0
    unit: ohm/sq
    source: "brief section 17: <= 5 ohm/sq"

  Ag_g_per_m2:
    label: Silver consumption
    direction: lower
    floor: 0.16
    target: 0.0
    exponent: 1.0
    unit: g/m2
    source: "brief section 20: minimise critical-material content. Floor is the
             areal mass of a 11 nm pure Ag layer, i.e. a conventional single-
             silver Low-E; scoring 0 there means 'no better than the incumbent'."

  cost_usd_per_m2:
    label: Metal cost
    direction: lower
    floor: 3.0
    target: 0.5
    exponent: 1.0
    unit: USD/m2
    source: "brief section 17: significantly below conventional benchmark"

  LSG:
    label: Light-to-solar-gain ratio
    direction: higher
    floor: 1.00
    target: 1.80
    exponent: 1.0
    unit: ""
    source: >
      T_vis / g. Floor 1.00 is a non-selective glazing; target 1.80 is
      approaching the best commercial solar-control products, so the
      criterion keeps discriminating across the whole realistic range.

  g_value:
    label: Solar heat gain coefficient
    direction: lower
    floor: 0.80
    target: 0.35
    exponent: 1.0
    unit: ""
    source: >
      EN 410 / ISO 9050 g = T_sol + N*A_sol, with N = 0.36 for a coating on
      surface 2 of a double-glazed unit. Indian ECBC requires SHGC below
      roughly 0.27-0.40 depending on climate zone and window-to-wall ratio;
      the floor and target here bracket that.

  supply_risk:
    label: Supply risk
    direction: lower
    floor: 9.5
    target: 4.0
    exponent: 1.0
    unit: ""
    source: "brief section 9 stage 1; composition-weighted element supply risk"

  thermal_stability_c:
    label: Thermal stability
    direction: higher
    floor: 200.0
    target: 500.0
    exponent: 1.0
    unit: degC
    source: "brief section 17: 300-500 C test window. NOT PREDICTED by this
             framework -- supply a measured value or leave it out of the score."

  deposition_efficiency:
    label: Deposition efficiency
    direction: higher
    floor: 0.2
    target: 1.0
    exponent: 1.0
    unit: ""
    source: "brief section 15: performance per unit deposition energy, not
             raw deposition rate"

# Weighting from the brief's section 14. Weights are renormalised over
# whichever criteria are actually available for a given candidate, so a
# candidate missing a measured thermal-stability number is scored on the rest
# rather than silently penalised.
# CORRECTED from the brief's section 14. Two deliberate departures, both
# documented in docs/FINDINGS.md:
#
# 1. Ag_g_per_m2 gets 0.15. The brief's section 14 table has no silver-
#    consumption line, even though sections 17 and 20 both name minimising Ag
#    as an objective. Encoding section 14 literally left the project's central
#    goal at zero weight, and the thickness optimiser duly returned a design
#    using MORE silver than the benchmark while scoring 100/100.
#
# 2. R_sheet drops from 0.15 to 0.0. It correlates with
#    emissivity_hemispherical at r = 0.996 across the candidate set -- both are
#    the free-carrier response of the same layer -- so scoring both put 0.40 of
#    the weight on one physical property. Sheet resistance is still computed
#    and reported; it is a constraint to check, not an independent objective.
#    Restore it (and cut emissivity to 0.15) if the coating must also serve as
#    a transparent electrode, where R_s matters in its own right.
weights:
  # Cooling-dominated. Solar rejection is the objective, so LSG and g-value
  # carry weight that they do not in the heating profile -- that difference is
  # the whole reason two files exist.
  emissivity_hemispherical: 0.20
  LSG: 0.20
  Ag_g_per_m2: 0.15
  g_value: 0.15
  T_vis: 0.10

  # Reported, not scored. Each correlates with a weighted criterion above:
  # cost with silver mass at r = 1.000, supply risk at r = 0.991, sheet
  # resistance with emissivity at r = 0.978. Weighting them alongside silver
  # mass placed a third of the effective weight on one physical property. This
  # is the same correction applied to the heating profile in targets.yaml --
  # it was made there first, and this file was left behind for a week.
  R_sheet: 0.0
  cost_usd_per_m2: 0.0
  supply_risk: 0.0
  U_g: 0.0

  # Not predicted for any candidate. Weight on an always-missing criterion
  # renormalises away silently, inflating the influence of the criteria that
  # do have values without saying so. structural_stability additionally had
  # no definition in this file at all, so it could never have scored.
  structural_stability: 0.0
  thermal_stability_c: 0.0
  deposition_efficiency: 0.0

aggregation: geometric
