[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pvdlowe"
version = "0.1.0"
description = "Screening and optimisation for sustainable Low-E PVD coatings on float glass"
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
excel = ["openpyxl>=3.1"]
mp = ["mp-api>=0.39"]
dev = ["pytest>=7.0"]

[project.scripts]
pvdlowe = "pvdlowe.cli:main"

[tool.setuptools]
packages = [
    "pvdlowe", "pvdlowe.materials", "pvdlowe.optics", "pvdlowe.electrical",
    "pvdlowe.screening", "pvdlowe.mp", "pvdlowe.dft", "pvdlowe.doe",
    "pvdlowe.optimize", "pvdlowe.report",
]

[tool.setuptools.package-data]
pvdlowe = ["../data/*.csv", "../data/*.yaml"]
